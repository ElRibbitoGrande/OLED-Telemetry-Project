[Metadata]
Skin name=Analog Floating 2 OLED Dashboard
Version=2.1
Information=Measured implementation of Analog_Floating2 blueprint
Author=OLED Telemetry Project

[Rainmeter]
Update=32
AccurateText=1
DynamicWindowSize=0
BackgroundMode=2
SolidColor=0,0,0,255
OnRefreshAction=[!HideMeterGroup AF2NowPlaying][!HideMeterGroup AF2Artwork][!ShowMeterGroup AF2NowPlayingIdle][!Redraw]

[Variables]
@Include1=#@#Includes\DashboardDefaults.inc
@Include2=#@#Includes\DashboardTelemetry.inc
@Include3=#@#Includes\DashboardState.inc
@Include4=#@#MeterStyles\AnalogFloating\Response.inc
@Include5=#@#VU\SignalAcquisition.inc
@Include6=#@#VU\MeterResponse.inc
@Include7=#@#MeterStyles\AnalogFloating2\VU.inc
@Include8=#@#MeterStyles\AnalogFloating2\Speakers.inc

