[AF2NowPlayingVisibility]
Measure=Calc
Formula=DashboardNowPlayingActive
IfCondition=AF2NowPlayingVisibility = 1
IfTrueAction=[!ShowMeterGroup AF2NowPlaying][!HideMeterGroup AF2NowPlayingIdle][!UpdateMeterGroup AF2NowPlaying][!Redraw]
IfFalseAction=[!HideMeterGroup AF2NowPlaying][!ShowMeterGroup AF2NowPlayingIdle][!Redraw]
DynamicVariables=1

[AF2ArtworkVisibility]
Measure=Calc
Formula=DashboardNowPlayingActive * DashboardNowPlayingArtworkAvailable
IfCondition=AF2ArtworkVisibility = 1
IfTrueAction=[!ShowMeterGroup AF2Artwork][!UpdateMeterGroup AF2Artwork][!Redraw]
IfFalseAction=[!HideMeterGroup AF2Artwork][!Redraw]
DynamicVariables=1

