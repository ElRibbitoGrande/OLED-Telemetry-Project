[Metadata]
Skin name=DESKTOP VU-METER 3 - Analog Frame AVR Telemetry + Format Logos
Version=5.0 Analog Frame AVR Edition
Information=Adaptive AVR VU Meter - Analog_Frame artwork, image needle, Denon audio telemetry strip
Author=HiTBiT-PA + ChatGPT

[Rainmeter]
Update=32
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1

KeepOnScreen=1
Draggable=1
ClickThrough=0

[Variables]
@include=#@#Variables.inc

vRMSAttack=85
vRMSDecay=520
vRMSGain=2.7

TelemetryLabelColor=145,175,215,210
TelemetryValueColor=225,232,255,235
TelemetryDimColor=115,135,170,190
TelemetryLineColor=90,120,170,130
TelemetryPanelColor=0,0,0,95

; =====================================================
; DENON STATUS FILE PARSING
; =====================================================

[MeasureStatusFile]
Measure=WebParser
URL=file://C:\RainmeterDenon\denon_status.txt
RegExp=(?s)Volume=([^\r\n]+).*Source=([^\r\n]+).*Mode=([^\r\n]+).*VisualMode=([^\r\n]+).*VisualModeCode=([01]).*InputSignal=([^\r\n]+).*SampleRate=([^\r\n]+).*SpeakerPreset=([^\r\n]+).*MultEQ=([^\r\n]+).*DynamicEQ=([^\r\n]+).*ReferenceLevelOffset=([^\r\n]+).*DynamicVolume=([^\r\n]+)
UpdateRate=1
DynamicVariables=1

[MeasureVolume]
Measure=WebParser
URL=[MeasureStatusFile]
StringIndex=1
DynamicVariables=1

[MeasureSource]
Measure=WebParser
URL=[MeasureStatusFile]
StringIndex=2
DynamicVariables=1

[MeasureMode]
Measure=WebParser
URL=[MeasureStatusFile]
StringIndex=3
DynamicVariables=1

[MeasureVisualMode]
Measure=WebParser
URL=[MeasureStatusFile]
StringIndex=4
DynamicVariables=1

[MeasureVisualModeCode]
Measure=WebParser
URL=[MeasureStatusFile]
StringIndex=5
DynamicVariables=1
IfMatch=1
IfMatchAction=[!HideMeterGroup Stereo][!ShowMeterGroup Atmos][!HideMeterGroup DTS][!UpdateMeterGroup Stereo][!UpdateMeterGroup Atmos][!UpdateMeterGroup DTS][!Redraw]
IfNotMatchAction=[!ShowMeterGroup Stereo][!HideMeterGroup Atmos][!HideMeterGroup DTS][!UpdateMeterGroup Stereo][!UpdateMeterGroup Atmos][!UpdateMeterGroup DTS][!Redraw]


[MeasureDTSModeOverride]
Measure=WebParser
URL=[MeasureStatusFile]
StringIndex=3
DynamicVariables=1
IfMatch=(?i)(DTS:X|NEURAL)
IfMatchAction=[!HideMeterGroup Stereo][!HideMeterGroup Atmos][!ShowMeterGroup DTS][!UpdateMeterGroup DTS][!Redraw]
IfNotMatchAction=[!HideMeterGroup DTS][!ShowMeterGroup Stereo][!HideMeterGroup Atmos][!UpdateMeterGroup Stereo][!Redraw]

[MeasureInputSignal]
Measure=WebParser
URL=[MeasureStatusFile]
StringIndex=6
DynamicVariables=1

[MeasureSampleRate]
Measure=WebParser
URL=[MeasureStatusFile]
StringIndex=7
DynamicVariables=1

[MeasureSpeakerPreset]
Measure=WebParser
URL=[MeasureStatusFile]
StringIndex=8
DynamicVariables=1

[MeasureMultEQ]
Measure=WebParser
URL=[MeasureStatusFile]
StringIndex=9
DynamicVariables=1

[MeasureDynamicEQ]
Measure=WebParser
URL=[MeasureStatusFile]
StringIndex=10
DynamicVariables=1

[MeasureReferenceLevelOffset]
Measure=WebParser
URL=[MeasureStatusFile]
StringIndex=11
DynamicVariables=1

[MeasureDynamicVolume]
Measure=WebParser
URL=[MeasureStatusFile]
StringIndex=12
DynamicVariables=1

; =====================================================
; AUDIO MEASURES
; =====================================================

[MeasureAudioOutput]
Measure=Plugin
Plugin=AudioLevel
Port=Output
RMSAttack=#vRMSAttack#
RMSDecay=#vRMSDecay#
RMSGain=#vRMSGain#

[MeasureAudioRMS_L]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudioOutput
Channel=L
Type=RMS

[MeasureAudioRMS_R]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudioOutput
Channel=R
Type=RMS

; =====================================================
; STEREO MODE — ANALOG5 DUAL METERS
; Needle origins intentionally moved downward to the
; center of the black oval at the bottom of each meter.
; =====================================================

[VU-Meter1]
Meter=Image
Group=Stereo
Hidden=0
X=0
Y=35
W=750
H=450
ImageName=#@#Images\analog\Analog_Frame.png
PreserveAspectRatio=1
AntiAlias=1

[VU-Meter2]
Meter=Image
Group=Stereo
Hidden=0
X=800
Y=35
W=750
H=450
ImageName=#@#Images\analog\Analog_Frame.png
PreserveAspectRatio=1
AntiAlias=1

; =====================================================
; IMAGE NEEDLES
; Uses Analog_Needle.png as a Rotator meter.
; These values are starting points for the new 750x450
; Analog_Frame art. The pivot should sit on the cap.
; Fine tune X/Y by a few pixels after loading.
; =====================================================

[MeterAudioRMS_L] 
Meter=Rotator 
Group=Stereo 
Hidden=0 
MeasureName=MeasureAudioRMS_L 
ImageName=#@#Images\analog\Analog_Needle.png 
X=365 
Y=245 
W=30 
H=300 
OffsetX=22 
OffsetY=294 
StartAngle=11.5 
RotationAngle=2.1 
AntiAlias=1 

[MeterAudioRMS_Shadow_L] 
Meter=Rotator 
Group=Stereo 
Hidden=0 
MeasureName=MeasureAudioRMS_L 
ImageName=#@#Images\analog\Analog_Needle.png 
X=362 
Y=242 
W=30 
H=300 
OffsetX=22 
OffsetY=294 
StartAngle=11.5 
RotationAngle=2.1 
AntiAlias=1  
ImageTint=0,0,0,50 

[MeterAudioRMS_R]
Meter=Rotator
Group=Stereo
Hidden=0
MeasureName=MeasureAudioRMS_R
ImageName=#@#Images\analog\Analog_Needle.png
X=1165
Y=245
W=30
H=300
OffsetX=22
OffsetY=294
StartAngle=11.5
RotationAngle=2.1
AntiAlias=1

[MeterAudioRMS_Shadow_R]
Meter=Rotator
Group=Stereo
Hidden=0
MeasureName=MeasureAudioRMS_R
ImageName=#@#Images\analog\Analog_Needle.png
X=1162
Y=242
W=30
H=300
OffsetX=22
OffsetY=294
StartAngle=11.5
RotationAngle=2.1
ImageTint=0,0,0,50
AntiAlias=1

; =====================================================
; IMMERSIVE FORMAT LOGOS
; Atmos uses Atmos_Logo_2_Black.png.
; DTS:X / Neural:X uses DTSX_Logo_b_Starfield.png.
; Place both image files in:
;   @Resources\Images\formats\
; =====================================================

[AtmosLogo]
Meter=Image
Group=Atmos
Hidden=1
X=355
Y=25
W=840
H=472
ImageName=#@#Images\analog\Atmos_Logo_2_Black.png
PreserveAspectRatio=1
AntiAlias=1

[DTSXLogo]
Meter=Image
Group=DTS
Hidden=1
X=405
Y=70
W=740
H=416
ImageName=#@#Images\analog\DTSX_Logo_b_Starfield.png
PreserveAspectRatio=1
AntiAlias=1


