WindowX=2560
WindowY=384
KeepOnScreen=0
SavePosition=1

[Metadata]
Name=Dashboard3
Author=Tim Grimm
Information=Dashboard 3.0 continuous 32-band spectrum prototype
Version=0.6

[Variables]
@Include1=#@#Spectrum\SpectrumAcquisition.inc

;==================================================
; FULL 2560 × 1600 CANVAS
;==================================================

[Background]
Meter=Shape
Shape=Rectangle 0,0,2560,1600 | Fill Color 18,18,18,255 | StrokeWidth 0

;==================================================
; LIVE 32-BAND FFT MEASURES + DISPLAY RESPONSE
;
; Raw measures preserve the actual FFT values.
; Display measures apply compression plus a gradual high-frequency lift.
;==================================================

[MeasureBand01]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudioSpectrum
Type=Band
BandIdx=0
Channel=Avg

[DisplayBand01]
Measure=Calc
Formula=Min(1, (MeasureBand01 ** 0.58) * 0.55)
DynamicVariables=1

