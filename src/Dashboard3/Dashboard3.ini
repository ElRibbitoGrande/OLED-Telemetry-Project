;==================================================
; LIVE SPECTRUM — CONTINUOUS BODY + RESTRAINED DEPTH
;
; One-pixel gaps make the spectrum read as a single mass.
; Soft inner highlights and fine crests add depth without a barcode effect.
;==================================================


;==================================================
; CONTINUOUS SPECTRUM TEST
;==================================================

[MeasureContinuousSpectrum]
Measure=Script
ScriptFile=#@#Spectrum\ContinuousSpectrum.lua
UpdateDivider=1

[ContinuousSpectrumTest]
Meter=Shape
Shape=Path SpectrumPath | Fill Color 30,150,210,135 | Stroke Color 225,240,250,255 | StrokeWidth 4
SpectrumPath=[MeasureContinuousSpectrum]
DynamicVariables=1

