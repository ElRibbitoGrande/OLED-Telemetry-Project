[Metadata]
Skin name=DESKTOP VU-METER 3 - AVR OLED ADAPTIVE
Version=3.9 AVR Edit

[Rainmeter]
Update=32
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
KeepOnScreen=1
Draggable=1
ClickThrough=0

[Variables]
@include=#@#Variables.inc

vRMSAttack=85
vRMSDecay=520
vRMSGain=2.6
vPeakAttack=60
vPeakDecay=700
vPeakGain=2.4

[MeasureModeFile]
Measure=WebParser
URL=file://C:\RainmeterDenon\denon_status.txt
RegExp=(?s)VisualModeCode=([01])
UpdateRate=1
DynamicVariables=1

[MeasureVisualModeCode]
Measure=WebParser
URL=[MeasureModeFile]
StringIndex=1
DynamicVariables=1
IfMatch=1
IfMatchAction=[!HideMeterGroup Stereo][!ShowMeterGroup Atmos][!UpdateMeterGroup Stereo][!UpdateMeterGroup Atmos][!Redraw]
IfNotMatchAction=[!ShowMeterGroup Stereo][!HideMeterGroup Atmos][!UpdateMeterGroup Stereo][!UpdateMeterGroup Atmos][!Redraw]

[MeasureAudioOutput]
Measure=Plugin
Plugin=AudioLevel
Port=Output
RMSAttack=#vRMSAttack#
RMSDecay=#vRMSDecay#
RMSGain=#vRMSGain#
PeakAttack=#vPeakAttack#
PeakDecay=#vPeakDecay#
PeakGain=#vPeakGain#

[MeasureAudioRMS_L]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudioOutput
Channel=L
Type=RMS

[MeasureAudioRMS_R]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudioOutput
Channel=R
Type=RMS

; ============================
; STEREO — DUAL VU METERS
; ============================

[VU-Meter1]
Meter=Image
Group=Stereo
X=70
Y=40
W=580
H=580
