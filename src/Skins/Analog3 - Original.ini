[Metadata]
Skin name=DESKTOP VU-METER 3
Version=3.9
Information=Audio Visualizer
Author=HiTBiT-PA
Website=http://hitbit-pa.deviantart.com/
License=Creative Commons Attribution - Non Commercial - Share Alike 3.0

[Rainmeter]
Update=32
ContextTitle=LOADER / PLAYER
ContextAction=!ToggleConfig "Desktop VU-Meter 3\Loader" "Loader.ini"
ContextTitle2=EXIT
ContextAction2=!DeactivateConfig "#CURRENTCONFIG#"
RightMouseUpAction=!SkinCustomMenu

[Variables]
@include=#@#Variables.inc

[MeasureAudioOutput]
Measure=Plugin
Plugin=AudioLevel
Port=Output
RMSAttack=#vRMSAttack#
RMSDecay=#vRMSDecay#
RMSGain=#vRMSGain#
PeakAttack=#vPeakAttack#
PeakDecay=#vPeakDecay#
PeakGain=#vPeakGain#

[MeasureAudioRMS_L]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudioOutput
Channel=L
Type=RMS

[MeasureAudioRMS_R]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudioOutput
Channel=R
Type=RMS

[MeasureAudioPeak_L]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudioOutput
Channel=L
Type=Peak

[MeasureAudioPeak_R]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudioOutput
Channel=R
Type=Peak

[MeasureLEDPeak_L]
Measure=Calc
Formula=MeasureAudioPeak_L
IfBelowValue=1
IfBelowAction=!HideMeter MeterLEDPeak_L
IfEqualValue=1
IfEqualAction=!ShowMeter MeterLEDPeak_L

[MeasureLEDPeak_R]
Measure=Calc
Formula=MeasureAudioPeak_R
IfBelowValue=1
IfBelowAction=!HideMeter MeterLEDPeak_R
IfEqualValue=1
IfEqualAction=!ShowMeter MeterLEDPeak_R

;

[VU-Meter1]
Meter=Image
X=0
Y=0
ImageName=#@#Images\analog\analog3.png

[VU-Meter2]
Meter=Image
X=126
Y=0
ImageName=#@#Images\analog\analog3.png

[TextL]
Meter=String
FontFace=Arial
FontColor=128,128,128
FontSize=8
StringStyle=Bold
StringAlign=Left
AntiAlias=1
X=56
Y=12
Text=L

[TextR]
Meter=String
FontFace=Arial
FontColor=128,128,128
FontSize=8
StringStyle=Bold
StringAlign=Left
AntiAlias=1
X=182
Y=12
Text=R

[MeterAudioRMS_L]
Meter=Rotator
MeasureName=MeasureAudioRMS_L
X=-5
Y=24
W=130
H=130
ImageName=#@#Images\analog\needle.png
Antialias=1
OffsetX=65
OffsetY=65
StartAngle=5.51
RotationAngle=1.55

[MeterAudioRMS_R]
Meter=Rotator
MeasureName=MeasureAudioRMS_R
X=121
Y=24
W=130
H=130
ImageName=#@#Images\analog\needle.png
Antialias=1
OffsetX=65
OffsetY=65
StartAngle=5.51
RotationAngle=1.55

[VU-Cap1]
Meter=Image
X=51
Y=79
ImageName=#@#Images\analog\VU-cap.png

[VU-Cap2]
Meter=Image
X=177
Y=79
ImageName=#@#Images\analog\VU-cap.png

[MeterLEDPeak_L]
Meter=IMAGE
X=45
Y=72
ImageName=#@#Images\analog\peak.png
DynamicVariables=1
Hidden=1

[MeterLEDPeak_R]
Meter=IMAGE
X=171
Y=72
ImageName=#@#Images\analog\peak.png
DynamicVariables=1
Hidden=1
