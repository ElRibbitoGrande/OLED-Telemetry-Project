[Rainmeter]
Update=32
ContextTitle=Loader
ContextAction=!ToggleConfig "Desktop VU-Meter 3\Loader" "Loader.ini"

[Variables]
@include=#@#Variables.inc
@include2=#@#Data\Measure Stereo Delay.inc
@include3=#@#Data\Bitmap Stereo Delay.inc

[StyleDelay]
X=30r
BitMapImage=#@#Images\leds3\4_i_delay.png
ImageTint=#vColor#,#vAlpha1#
BitMapFrames=38
BitmapZeroFrame=1
DynamicVariables=1

[StyleFFT]
X=30r
Y=r
BitMapImage=#@#Images\leds3\4_i_bitmap.png
BitMapFrames=38
BitmapZeroFrame=1
ImageTint=#vColor#,#vAlpha1#
