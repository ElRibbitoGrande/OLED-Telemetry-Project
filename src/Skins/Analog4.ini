[Metadata]
Skin name=DESKTOP VU-METER 3 - AVR OLED ADAPTIVE LED
Version=3.9 AVR Edit

[Rainmeter]
Update=32
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
KeepOnScreen=1
Draggable=1
ClickThrough=0

[Variables]
@include=#@#Variables.inc

vRMSAttack=85
vRMSDecay=520
vRMSGain=2.8

[MeasureModeFile]
Measure=WebParser
URL=file://C:\RainmeterDenon\denon_status.txt
RegExp=(?s)VisualModeCode=([01])
UpdateRate=1
DynamicVariables=1

[MeasureVisualModeCode]
Measure=WebParser
URL=[MeasureModeFile]
StringIndex=1
DynamicVariables=1
IfMatch=1
IfMatchAction=[!HideMeterGroup Stereo][!ShowMeterGroup Atmos][!UpdateMeterGroup Stereo][!UpdateMeterGroup Atmos][!Redraw]
IfNotMatchAction=[!ShowMeterGroup Stereo][!HideMeterGroup Atmos][!UpdateMeterGroup Stereo][!UpdateMeterGroup Atmos][!Redraw]

[MeasureAudioOutput]
Measure=Plugin
Plugin=AudioLevel
Port=Output
RMSAttack=#vRMSAttack#
RMSDecay=#vRMSDecay#
RMSGain=#vRMSGain#

[MeasureRMS_L]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudioOutput
Channel=L
Type=RMS
IfCondition=MeasureRMS_L < 0.1
IfTrueAction=[!SetOption MeterFx_L ImageName "01.png"][!UpdateMeterGroup Stereo][!Redraw]
IfCondition2=(MeasureRMS_L >= 0.1) && (MeasureRMS_L < 0.1332)
IfTrueAction2=[!SetOption MeterFx_L ImageName "02.png"][!UpdateMeterGroup Stereo][!Redraw]
IfCondition3=(MeasureRMS_L >= 0.1332) && (MeasureRMS_L < 0.1998)
IfTrueAction3=[!SetOption MeterFx_L ImageName "03.png"][!UpdateMeterGroup Stereo][!Redraw]
IfCondition4=(MeasureRMS_L >= 0.1998) && (MeasureRMS_L < 0.2664)
IfTrueAction4=[!SetOption MeterFx_L ImageName "04.png"][!UpdateMeterGroup Stereo][!Redraw]
IfCondition5=(MeasureRMS_L >= 0.2664) && (MeasureRMS_L < 0.3333)
IfTrueAction5=[!SetOption MeterFx_L ImageName "05.png"][!UpdateMeterGroup Stereo][!Redraw]
IfCondition6=(MeasureRMS_L >= 0.3333) && (MeasureRMS_L < 0.3996)
IfTrueAction6=[!SetOption MeterFx_L ImageName "06.png"][!UpdateMeterGroup Stereo][!Redraw]
IfCondition7=(MeasureRMS_L >= 0.3996) && (MeasureRMS_L < 0.4662)
IfTrueAction7=[!SetOption MeterFx_L ImageName "07.png"][!UpdateMeterGroup Stereo][!Redraw]
IfCondition8=(MeasureRMS_L >= 0.4662) && (MeasureRMS_L < 0.5328)
IfTrueAction8=[!SetOption MeterFx_L ImageName "08.png"][!UpdateMeterGroup Stereo][!Redraw]
IfCondition9=(MeasureRMS_L >= 0.5328) && (MeasureRMS_L < 0.5994)
IfTrueAction9=[!SetOption MeterFx_L ImageName "09.png"][!UpdateMeterGroup Stereo][!Redraw]
IfCondition10=(MeasureRMS_L >= 0.5994) && (MeasureRMS_L < 0.6666)
IfTrueAction10=[!SetOption MeterFx_L ImageName "10.png"][!UpdateMeterGroup Stereo][!Redraw]
IfCondition11=(MeasureRMS_L >= 0.6666) && (MeasureRMS_L < 0.7326)
IfTrueAction11=[!SetOption MeterFx_L ImageName "11.png"][!UpdateMeterGroup Stereo][!Redraw]
IfCondition12=(MeasureRMS_L >= 0.7326) && (MeasureRMS_L < 0.7992)
IfTrueAction12=[!SetOption MeterFx_L ImageName "12.png"][!UpdateMeterGroup Stereo][!Redraw]
IfCondition13=(MeasureRMS_L >= 0.7992) && (MeasureRMS_L < 0.8658)
IfTrueAction13=[!SetOption MeterFx_L ImageName "13.png"][!UpdateMeterGroup Stereo][!Redraw]
IfCondition14=(MeasureRMS_L >= 0.8658) && (MeasureRMS_L < 0.9324)
IfTrueAction14=[!SetOption MeterFx_L ImageName "14.png"][!UpdateMeterGroup Stereo][!Redraw]
IfCondition15=MeasureRMS_L >= 0.9324
IfTrueAction15=[!SetOption MeterFx_L ImageName "15.png"][!UpdateMeterGroup Stereo][!Redraw]

[MeasureRMS_R]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudioOutput
Channel=R
Type=RMS
IfCondition=MeasureRMS_R < 0.1
IfTrueAction=[!SetOption MeterFx_R ImageName "01.png"][!UpdateMeterGroup Stereo][!Redraw]
IfCondition2=(MeasureRMS_R >= 0.1) && (MeasureRMS_R < 0.1332)
IfTrueAction2=[!SetOption MeterFx_R ImageName "02.png"][!UpdateMeterGroup Stereo][!Redraw]
IfCondition3=(MeasureRMS_R >= 0.1332) && (MeasureRMS_R < 0.1998)
IfTrueAction3=[!SetOption MeterFx_R ImageName "03.png"][!UpdateMeterGroup Stereo][!Redraw]
IfCondition4=(MeasureRMS_R >= 0.1998) && (MeasureRMS_R < 0.2664)
IfTrueAction4=[!SetOption MeterFx_R ImageName "04.png"][!UpdateMeterGroup Stereo][!Redraw]
IfCondition5=(MeasureRMS_R >= 0.2664) && (MeasureRMS_R < 0.3333)
IfTrueAction5=[!SetOption MeterFx_R ImageName "05.png"][!UpdateMeterGroup Stereo][!Redraw]
IfCondition6=(MeasureRMS_R >= 0.3333) && (MeasureRMS_R < 0.3996)
IfTrueAction6=[!SetOption MeterFx_R ImageName "06.png"][!UpdateMeterGroup Stereo][!Redraw]
IfCondition7=(MeasureRMS_R >= 0.3996) && (MeasureRMS_R < 0.4662)
IfTrueAction7=[!SetOption MeterFx_R ImageName "07.png"][!UpdateMeterGroup Stereo][!Redraw]
IfCondition8=(MeasureRMS_R >= 0.4662) && (MeasureRMS_R < 0.5328)
IfTrueAction8=[!SetOption MeterFx_R ImageName "08.png"][!UpdateMeterGroup Stereo][!Redraw]
IfCondition9=(MeasureRMS_R >= 0.5328) && (MeasureRMS_R < 0.5994)
IfTrueAction9=[!SetOption MeterFx_R ImageName "09.png"][!UpdateMeterGroup Stereo][!Redraw]
IfCondition10=(MeasureRMS_R >= 0.5994) && (MeasureRMS_R < 0.6666)
IfTrueAction10=[!SetOption MeterFx_R ImageName "10.png"][!UpdateMeterGroup Stereo][!Redraw]
IfCondition11=(MeasureRMS_R >= 0.6666) && (MeasureRMS_R < 0.7326)
IfTrueAction11=[!SetOption MeterFx_R ImageName "11.png"][!UpdateMeterGroup Stereo][!Redraw]
IfCondition12=(MeasureRMS_R >= 0.7326) && (MeasureRMS_R < 0.7992)
IfTrueAction12=[!SetOption MeterFx_R ImageName "12.png"][!UpdateMeterGroup Stereo][!Redraw]
IfCondition13=(MeasureRMS_R >= 0.7992) && (MeasureRMS_R < 0.8658)
IfTrueAction13=[!SetOption MeterFx_R ImageName "13.png"][!UpdateMeterGroup Stereo][!Redraw]
IfCondition14=(MeasureRMS_R >= 0.8658) && (MeasureRMS_R < 0.9324)
IfTrueAction14=[!SetOption MeterFx_R ImageName "14.png"][!UpdateMeterGroup Stereo][!Redraw]
IfCondition15=MeasureRMS_R >= 0.9324
IfTrueAction15=[!SetOption MeterFx_R ImageName "15.png"][!UpdateMeterGroup Stereo][!Redraw]

; ============================
; STEREO — DUAL ANALOG LED METERS
; ============================

[MeterFx_L]
Meter=Image
Group=Stereo
X=70
Y=40
W=580
H=580
ImagePath=#@#Images\analog leds
ImageName=01.png
DynamicVariables=1
AntiAlias=1

[MeterFx_R]
Meter=Image
Group=Stereo
X=760
Y=40
W=580
H=580
ImagePath=#@#Images\analog leds
ImageName=01.png
DynamicVariables=1
AntiAlias=1

; ============================
; ATMOS / DTS:X / MULTICHANNEL — STATIC MODE DISPLAY
; ============================

[AtmosText]
Meter=String
Group=Atmos
Hidden=1
Text=IMMERSIVE AUDIO
X=705
Y=230
FontFace=Bahnschrift Light
FontSize=52
FontColor=180,215,255,235
StringAlign=Center
AntiAlias=1

[AtmosSubText]
Meter=String
Group=Atmos
Hidden=1
Text=DOLBY ATMOS / DTS:X / MULTICHANNEL
X=705
Y=315
FontFace=Bahnschrift Light
FontSize=28
FontColor=120,170,220,210
StringAlign=Center
AntiAlias=1
